[project]
name = "researcherer"
version = "0.1.0"
description = "A terminal UI to fetch and read arXiv papers as PDFs."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "MINERVA-RP" }]
keywords = ["arxiv", "pdf", "tui", "textual", "research"]
dependencies = [
    "textual>=0.80",
    "textual-image>=0.13.2",
    "pymupdf>=1.27,<2",
    "httpx>=0.27",
    "feedparser>=6.0",
    "platformdirs>=4.0",
]

[project.scripts]
researcherer = "researcherer.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/researcherer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
